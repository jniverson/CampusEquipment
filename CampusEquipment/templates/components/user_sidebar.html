
<aside class="user-sidebar">

    <!-- BRAND -->
    <div class="user-sidebar-brand">
        CampusGear
    </div>

    <!-- NAVIGATION -->
    <nav class="user-sidebar-nav"
         aria-label="User navigation">


        <!-- BROWSE EQUIPMENT -->

        <a href="{% url 'browse_equipment_preview' %}"
           class="user-nav-link
           {% if request.resolver_match.url_name == 'browse_equipment_preview' %}
           active
           {% endif %}">

            <i class="icon icon-package-search"
               aria-hidden="true"></i>

            <span>Browse Equipment</span>
        </a>





        <!-- NEW REQUEST -->
        <a href="{% url 'user_new_request_preview' %}"
           class="user-nav-link
           {% if request.resolver_match.url_name == 'user_new_request_preview' %}
           active
           {% endif %}">

            <i class="icon icon-circle-plus" aria-hidden="true"></i>
            <span>New Request</span>
        </a>




        <!-- MY REQUESTS -->
        <a href="{% url 'my_requests_preview' %}"
           class="user-nav-link
           {% if request.resolver_match.url_name == 'my_requests_preview' %}
           active
           {% endif %}">

            <i class="icon icon-clipboard-list"
               aria-hidden="true"></i>

            <span>My Requests</span>
        </a>



        <!-- MY LOANS -->
        <a href="{% url 'my_loans_preview' %}"
           class="user-nav-link
           {% if request.resolver_match.url_name == 'my_loans_preview' %}
           active
           {% endif %}">

            <i class="icon icon-package-check"
               aria-hidden="true"></i>

            <span>My Loans</span>
        </a>



        <!-- PROFILE -->
        <a href="{% url 'user_profile_preview' %}"
           class="user-nav-link
           {% if request.resolver_match.url_name == 'user_profile_preview' %}
           active
           {% endif %}">

            <i class="icon icon-user-round"
               aria-hidden="true"></i>

            <span>Profile</span>
        </a>


    </nav>

    <!-- LOGOUT -->
    <div class="user-sidebar-logout">

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}

            <button type="submit" class="user-logout-btn">

                <i class="icon icon-log-out"
                   aria-hidden="true"></i>

                <span>Log Out</span>

            </button>

        </form>

    </div>

</aside>
