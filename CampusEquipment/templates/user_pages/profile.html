
{% extends 'base_user.html' %}
{% load static %}

{% block title %}CampusGear | Profile{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/user_profile.css' %}">
{% endblock %}

{% block content %}

<div class="up-page">

    <!-- PAGE HEADER -->
    <header class="up-header">
        <h1>Profile</h1>
        <p>You can edit your name and contact number only.</p>
    </header>

    <!-- PROFILE CARD -->
    <section class="up-card">

        <form method="post"
              action="{% url 'user_profile_preview' %}"
              class="up-form">

            {% csrf_token %}

            <!-- FULL NAME -->
            <div class="up-field">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    value="{{ profile.full_name }}"
                    maxlength="150"
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- CONTACT NUMBER -->
            <div class="up-field">
                <label for="contactNumber">Contact Number</label>

                <input
                    type="tel"
                    id="contactNumber"
                    name="contact_number"
                    value="{{ profile.contact_number }}"
                    maxlength="11"
                    pattern="09[0-9]{9}"
                    placeholder="e.g. 09123456789"
                    title="Enter an 11-digit Philippine mobile number starting with 09">
            </div>

            <!-- EMAIL -->
            <div class="up-field">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    value="{{ profile.email }}"
                    readonly
                    class="up-readonly">
            </div>

            <!-- ROLE -->
            <div class="up-field">
                <label for="role">Role</label>

                <input
                    type="text"
                    id="role"
                    value="{{ profile.role }}"
                    readonly
                    class="up-readonly">
            </div>

            <!-- ACCOUNT STATUS -->
            <div class="up-field">
                <label for="accountStatus">Account Status</label>

                <input
                    type="text"
                    id="accountStatus"
                    value="{{ profile.account_status }}"
                    readonly
                    class="up-readonly">
            </div>

            {% if message %}
            <div class="up-message
                {% if validation_passed %}up-success{% endif %}"
                 role="status">
                {{ message }}
            </div>
            {% endif %}

           <!-- ACTION BUTTON -->
            <div class="up-actions">

                <button type="submit"
                        class="up-btn up-btn-primary">
                    Save Changes
                </button>

            </div>




        </form>

    </section>

</div>

{% endblock %}
